# Web server settings for davidlevine.dev (nginx, running on Cloud Run).
# Cloud Run sends visitors to port 8080 and handles HTTPS before requests get here.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;      # don't advertise the nginx version
    absolute_redirect off;  # nginx's own redirects stay on whatever address the visitor used

    # One official address: www.davidlevine.dev sends visitors to davidlevine.dev (same page).
    if ($host = "www.davidlevine.dev") {
        return 301 https://davidlevine.dev$request_uri;
    }

    # Security headers. Only this site's own files may load: its pages, styles, fonts, images and its one
    # script (case-study-nav.js). Nothing from other websites, no inline code, no forms or embeds.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    # No includeSubDomains: this site must not set rules for other projects' subdomains
    # (gameday.davidlevine.dev etc.). Every .dev address is HTTPS-only in browsers anyway.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css image/svg+xml text/plain application/javascript;

    # Pages: always check for a newer version, so edits show up right after a deploy.
    location ~* \.html$ {
        expires -1;
    }
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    # Styles and scripts: always check for a newer version (a quick "not changed" reply when nothing has),
    # so design changes show up right after a deploy, not up to an hour later.
    location ~* \.(css|js)$ {
        expires -1;
    }
    # Fonts, icons, images, PDFs: browsers may reuse them for an hour.
    location ~* \.(woff2|svg|png|jpe?g|webp|avif|ico|pdf)$ {
        expires 1h;
    }
    # Clean addresses: /projects serves projects.html, /projects/game-day serves projects/game-day.html.
    location / {
        expires -1;   # pages served by clean address: always check for a newer version too
        try_files $uri $uri.html $uri/ =404;
    }

    # Missing pages, and folders without a page in them, show the friendly "not found" page.
    error_page 403 404 =404 /404.html;
}
